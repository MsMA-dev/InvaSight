name: Airflow CI/CD

# Build the Airflow image, prove every DAG imports inside it, publish it to
# Docker Hub, then roll it out on the Airflow EC2.
on:
  push:
    branches: [main]
    paths:
      - "doockerImageForDags/**"
      - ".github/workflows/airflow-cicd.yml"
  workflow_dispatch:

# Never run two deploys against the EC2 at once
concurrency:
  group: airflow-deploy
  cancel-in-progress: false

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.USERNAME_TEAM }}/invasight-airflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: doockerImageForDags
          file: doockerImageForDags/dockerfile
          load: true
          tags: invasight-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test - every DAG imports inside the image
        run: |
          docker run --rm \
            -v "$PWD/doockerImageForDags/airflow/dags:/opt/airflow/dags" \
            -v "$PWD/doockerImageForDags/tests:/tests" \
            -e PYTHONPATH=/opt/airflow/dags \
            --entrypoint python \
            invasight-airflow:ci /tests/test_dag_integrity.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME_TEAM }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest is what the EC2 runs; the commit tag allows rolling back to any build
      - name: Push image
        run: |
          docker tag invasight-airflow:ci "$IMAGE:latest"
          docker tag invasight-airflow:ci "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Airflow EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.EC2_APP_DIR }}"
            git pull --ff-only origin main
            cd doockerImageForDags
            # docker-compose.yaml reads the image name from .env
            echo "AIRFLOW_IMAGE=${{ secrets.USERNAME_TEAM }}/invasight-airflow:latest" > .env
            docker compose pull
            docker compose up -d --no-build
            docker image prune -f
            docker compose ps
