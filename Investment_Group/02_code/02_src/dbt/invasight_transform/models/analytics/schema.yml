version: 2

models:

  # =========================
  # DIMENSIONS
  # =========================

  - name: dim_asset
    description: >
      Asset dimension containing equities, ETFs, and precious metals.
    columns:

      - name: asset_key
        description: Primary key for the asset dimension.
        tests:
          - not_null
          - unique

      - name: ticker
        description: Asset ticker or instrument symbol.

      - name: asset_name
        description: Descriptive asset name.

      - name: asset_type
        description: Classification of the asset.
        tests:
          - accepted_values:
              values: ['EQUITY', 'ETF', 'METAL']

      - name: sector
        description: Sector or category associated with the asset.

  - name: dim_client
    description: >
      Client dimension containing unique portfolio clients.
    columns:

      - name: client_key
        description: Primary key for the client dimension.
        tests:
          - not_null
          - unique

      - name: client_id
        description: Business identifier for the client.

  - name: dim_currency
    description: >
      Currency dimension containing currencies used by the investment data.
    columns:

      - name: currency_key
        description: Primary key for the currency dimension.
        tests:
          - not_null
          - unique

      - name: currency_code
        description: ISO-style currency code.
        tests:
          - accepted_values:
              values: ['CHF', 'EUR', 'GBP', 'SAR', 'USD']

      - name: currency_name
        description: Descriptive currency name.

  - name: dim_date
    description: >
      Date dimension used to provide consistent calendar attributes across analytical facts.
    columns:

      - name: date_key
        description: Primary key for the date dimension.
        tests:
          - not_null
          - unique

      - name: full_date
        description: Full calendar date.

      - name: day
        description: Day of month.

      - name: month
        description: Calendar month number.

      - name: quarter
        description: Calendar quarter number.

      - name: year
        description: Calendar year.

      - name: day_of_week
        description: Name or representation of the day of week.

  - name: dim_source
    description: >
      Source dimension describing internal and external data providers.
    columns:

      - name: source_key
        description: Primary key for the source dimension.
        tests:
          - not_null
          - unique

      - name: source_name
        description: Name of the data source.

      - name: source_type
        description: Indicates whether the source is internal or external.
        tests:
          - accepted_values:
              values: ['External', 'Internal']

  # =========================
  # FACTS
  # =========================

  - name: fact_holdings
    description: >
      Transaction-level holdings fact containing client investment activity, quantities, prices, fees, FX conversion, and SAR values.
    columns:

      - name: holding_key
        description: Primary key for the holdings fact.
        tests:
          - not_null
          - unique

      - name: date_key
        description: Foreign key to DIM_DATE.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: asset_key
        description: Foreign key to DIM_ASSET.
        tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key

      - name: client_key
        description: Foreign key to DIM_CLIENT.
        tests:
          - not_null
          - relationships:
              to: ref('dim_client')
              field: client_key

      - name: currency_key
        description: Foreign key to DIM_CURRENCY.
        tests:
          - not_null
          - relationships:
              to: ref('dim_currency')
              field: currency_key

      - name: transaction_type
        description: Indicates whether the transaction is a BUY or SELL.
        tests:
          - accepted_values:
              values: ['BUY', 'SELL']

      - name: quantity
        description: Quantity involved in the transaction.

      - name: price
        description: Transaction price in the source currency.

      - name: exchange_rate
        description: Exchange rate used to convert transaction value to SAR.

      - name: fees
        description: Fees associated with the transaction.

      - name: transaction_value
        description: Transaction value before SAR conversion.

      - name: value_sar
        description: Transaction value converted to SAR.

  - name: fact_market_prices
    description: >
      Market-price fact containing asset prices by date, currency, and source with SAR-normalized values.
    columns:

      - name: market_price_key
        description: Primary key for the market-price fact.
        tests:
          - not_null
          - unique

      - name: date_key
        description: Foreign key to DIM_DATE.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: asset_key
        description: Foreign key to DIM_ASSET.
        tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key

      - name: currency_key
        description: Foreign key to DIM_CURRENCY.
        tests:
          - not_null
          - relationships:
              to: ref('dim_currency')
              field: currency_key

      - name: source_key
        description: Foreign key to DIM_SOURCE.
        tests:
          - not_null
          - relationships:
              to: ref('dim_source')
              field: source_key

      - name: close_price
        description: Closing or representative market price.

      - name: exchange_rate
        description: Exchange rate used for SAR conversion.

      - name: price_sar
        description: Market price converted to SAR.

  - name: fact_daily_portfolio_summary
    description: >
      Daily client-level portfolio summary containing investment, valuation, fees, return, profit or loss, and currency exposure.
    columns:

      - name: portfolio_summary_key
        description: Primary key for the daily portfolio summary.
        tests:
          - not_null
          - unique

      - name: date_key
        description: Foreign key to DIM_DATE.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: client_key
        description: Foreign key to DIM_CLIENT.
        tests:
          - not_null
          - relationships:
              to: ref('dim_client')
              field: client_key

      - name: total_investment
        description: Total client investment for the date.

      - name: portfolio_value_sar
        description: Portfolio market value expressed in SAR.

      - name: total_fees
        description: Total fees associated with the portfolio.

      - name: daily_return
        description: Daily portfolio return.

      - name: pnl_sar
        description: Portfolio profit or loss expressed in SAR.

      - name: currency_exposure_sar
        description: Currency exposure expressed in SAR.
